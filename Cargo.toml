[package]
name = "aq-engine"
version = "0.2.0"
authors = ["Moustapha Diaby <contact@isaacdiaby.tech>"]
description = "AlgoQuant Engine"
documentation = "https://algoquantstudio.com"
edition = "2024"
license-file = "LICENSE"
repository = "https://github.com/algoquantstudio/aq-engine"

[dependencies]
aqe-live-protocol = { path = "live-sync-protocol", version = "0.1.14" }
serde = { version = "1.0.229", features = ["derive"] }
chrono = { version = "0.4.45", features = ["serde"] }
uuid = { version = "1.24.1", features = ["v4", "v5", "js"] }
serde_json = { version = "1.0.151", features = ["float_roundtrip"] }
sha2 = "0.11.0"
hex = "0.4.3"
log = { version = "0.4.33", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
csv = { version = "1.4.0", optional = true }
polars = { version = "0.55.2", default-features = false, features = ["parquet", "lazy", "rolling_window", "abs", "cum_agg", "cov"], optional = true }
reqwest = { version = "0.13.4", features = ["json", "blocking", "cookies"], optional = true }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs"], optional = true }
tokio = { version = "1.53.1", features = ["full"], optional = true }
tokio-tungstenite = { version = "0.28.0", features = ["rustls-tls-webpki-roots"], optional = true }
parking_lot = { version = "0.12.5", optional = true }
dashmap = { version = "6.2.1", optional = true }
rustc-hash = { version = "2.1.3", optional = true }
futures = { version = "0.3.34", features = ["executor"], optional = true }
surrealdb = { version = "3.2.4", default-features = false, features = ["protocol-ws", "protocol-http", "rustls"], optional = true }
turso = { version = "0.7.2", optional = true }
actix-web = { version = "4.15.0", optional = true }
actix-ws = { version = "0.4.0", optional = true }
async-nats = { version = "0.46.0", default-features = false, features = ["aws-lc-rs"], optional = true }
async-trait = { version = "0.1.89", optional = true }
flatbuffers = { version = "25.12.19", optional = true }
env_logger = { version = "0.11.11", optional = true }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "unstable-rendered-line-info"], optional = true }
crossterm = { version = "0.29", optional = true }


[features]
default = []
node = []
runtime = [
    "dep:csv",
    "dep:polars",
    "dep:reqwest",
    "dep:rustls",
    "dep:tokio",
    "dep:tokio-tungstenite",
    "dep:parking_lot",
    "dep:dashmap",
    "dep:rustc-hash",
    "dep:futures",
    "dep:surrealdb",
    "dep:turso",
    "dep:log",
    "dep:actix-web",
    "dep:actix-ws",
    "dep:async-nats",
    "dep:async-trait",
    "dep:flatbuffers",
    "dep:env_logger",
]
tui = [
    "runtime",
    "dep:ratatui",
    "dep:crossterm",
]

[dev-dependencies]
env_logger = "0.11.11"
